# CI Workers Builds project name (repo: tarkov-cheats-.org → Worker: tarkov-cheats--org)
name = "tarkov-cheats--org"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Workers Builds runs `npx wrangler deploy` only — build dist/ before upload.
[build]
command = "npm ci && npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://tarkovcheats.org 301s always apply
run_worker_first = true
